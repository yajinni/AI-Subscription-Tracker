name: Run authentication race safety v2

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/run-auth-race-safety-v2.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Extract and run robust patch
        shell: bash
        run: |
          awk '
            /python3 <<'\''PY'\''/ { capture=1; next }
            capture && /^          PY$/ { capture=0; exit }
            capture { sub(/^          /, ""); print }
          ' .github/workflows/apply-auth-race-safety-v2.yml > /tmp/race.py
          test -s /tmp/race.py
          python3 /tmp/race.py
          cargo fmt --manifest-path src-tauri/Cargo.toml
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Install frontend dependencies
        run: npm install
      - name: Validate frontend
        run: |
          npm run check
          npm run build
      - name: Commit race-safety changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/grok_login.rs src-tauri/src/google_ai_studio_oauth.rs src-tauri/src/lib.rs src-tauri/src/oauth.rs src-tauri/src/opencode_login.rs
          git commit -m "Prevent stale authentication completion after cancel"
          git push origin HEAD:${{ github.head_ref }}
