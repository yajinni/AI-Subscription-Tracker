name: Run cancellable authentication patch

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/run-cancellable-auth-fix-on-pr.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Extract and run focused patch
        shell: bash
        run: |
          awk '
            /python3 <<'\''PY'\''/ { capture=1; next }
            capture && /^          PY$/ { capture=0; exit }
            capture { sub(/^          /, ""); print }
          ' .github/workflows/apply-cancellable-auth-fix.yml > /tmp/apply.py
          test -s /tmp/apply.py
          python3 /tmp/apply.py
          cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Install frontend dependencies
        run: npm install
      - name: Validate frontend
        run: |
          npm run check
          npm run build
      - name: Validate Rust
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml
          cargo check --manifest-path src-tauri/Cargo.toml
      - name: Commit focused changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md src/api.ts src/components/AccountAlertModal.tsx src/components/AddAccountModal.tsx src/components/GoogleAiStudioUsageModal.tsx src/ui-refinements.ts src-tauri/src/google_ai_studio_oauth.rs src-tauri/src/lib.rs src-tauri/src/oauth.rs src-tauri/src/state.rs
          git commit -m "Allow cancelling active account authentication"
          git push origin HEAD:${{ github.head_ref }}
