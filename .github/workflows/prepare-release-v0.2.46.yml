name: Prepare v0.2.46 release

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize-release:
    if: github.head_ref == 'ai/release-v0.2.46'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Finalize release metadata
        run: python .github/prepare-release-v0.2.46.py
      - name: Remove one-time finalizer
        run: |
          rm .github/prepare-release-v0.2.46.py
          rm .github/workflows/prepare-release-v0.2.46.yml
      - name: Commit final release files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json src-tauri/Cargo.toml src-tauri/tauri.conf.json CHANGELOG.md .github/release-trigger
          git add -u .github/prepare-release-v0.2.46.py .github/workflows/prepare-release-v0.2.46.yml
          git diff --cached --quiet && { echo "No release changes to commit"; exit 1; }
          git commit -m "chore: finalize v0.2.46 release"
          git push origin HEAD:${{ github.head_ref }}
