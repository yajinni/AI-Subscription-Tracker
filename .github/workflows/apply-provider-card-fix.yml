name: Apply provider card fix

on:
  push:
    branches:
      - ai/fix-provider-card-layout-v2

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai/fix-provider-card-layout-v2
          fetch-depth: 0

      - name: Apply provider-specific stable layout fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          app = Path('src/App.tsx')
          text = app.read_text()
          old = '''  const creditLabel = account.lastUsage?.unlimitedCredits
            ? "Credits: Unlimited"
            : account.lastUsage?.creditsUsd != null
              ? `Credits: $${account.lastUsage.creditsUsd.toFixed(2)}`
              : "Credits: —";'''
          new = '''  const creditLabel = account.provider !== "openai"
            ? null
            : account.lastUsage?.unlimitedCredits
              ? "Credits: Unlimited"
              : account.lastUsage?.creditsUsd != null
                ? `Credits: $${account.lastUsage.creditsUsd.toFixed(2)}`
                : null;'''
          if old not in text:
              raise SystemExit('App credit block not found')
          text = text.replace(old, new, 1)

          old = '<div className={`account-card-metrics ${windows.length > 2 ? "multi-row-metrics" : ""}`}>'
          new = '<div className={`account-card-metrics${windows.length > 1 ? " two-column-metrics" : ""}${windows.length > 2 ? " multi-row-metrics" : ""}`}>'
          if old not in text:
              raise SystemExit('Metrics class block not found')
          text = text.replace(old, new, 1)

          old = '              <span className="metric-inline-credit">{creditLabel}</span>'
          new = '              {creditLabel ? <span className="metric-inline-credit">{creditLabel}</span> : null}'
          if old not in text:
              raise SystemExit('Unavailable credit element not found')
          text = text.replace(old, new, 1)

          old = '        <strong className="metric-full-value">{remaining == null ? unavailableLabel : `${Math.round(remaining)}% remaining`}</strong>'
          new = '        <strong className="metric-full-value">{remaining == null ? unavailableLabel : `${Math.round(remaining)}%`}</strong>'
          if old not in text:
              raise SystemExit('Remaining percentage text not found')
          text = text.replace(old, new, 1)
          app.write_text(text)

          obsidian = Path('src/obsidian-dashboard.css')
          text = obsidian.read_text()
          old = '''.account-card-metrics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(100%, 210px), 1fr));
            align-items: start;
            grid-auto-rows: max-content;
            gap: 0 18px;
            padding: 0 16px;
            overflow: visible;
          }
'''
          new = '''.account-card-metrics {
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            align-items: start;
            grid-auto-rows: max-content;
            gap: 0 18px;
            padding: 0 16px;
            overflow: visible;
          }

          .account-card-metrics.two-column-metrics {
            grid-template-columns: repeat(2, minmax(0, 1fr));
          }
'''
          if old not in text:
              raise SystemExit('Obsidian metrics grid not found')
          text = text.replace(old, new, 1)
          text = text.replace('grid-template-columns: auto minmax(44px, 1fr) auto;', 'grid-template-columns: auto minmax(0, 1fr) auto;', 1)
          text = text.replace('  min-width: 44px;\n  height: 6px;', '  min-width: 0;\n  height: 6px;', 1)
          obsidian.write_text(text)

          responsive = Path('src/account-card-responsive.css')
          responsive.write_text('''/* Account cards keep one unchanged structure at every width. */
          .provider-account-card {
            min-height: max-content;
          }

          .provider-account-card .account-card-identity {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            grid-template-areas:
              "name actions"
              "email empty";
            align-items: center;
            column-gap: 8px;
            min-width: 0;
          }

          .provider-account-card .account-card-name-row {
            grid-area: name;
            min-width: 0;
            flex-wrap: nowrap;
            overflow: hidden;
          }

          .provider-account-card .account-card-name-row > h2,
          .provider-account-card .account-card-name-row > .account-card-name-input {
            min-width: 0;
            flex: 1 1 auto;
          }

          .provider-account-card .account-card-email {
            grid-area: email;
            min-width: 0;
            margin: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
          }

          .provider-account-card .account-card-name-actions {
            grid-area: actions;
            display: inline-flex !important;
            align-items: center;
            justify-content: flex-end;
            gap: 4px;
            flex: 0 0 auto;
            margin-left: auto;
            visibility: visible;
          }

          .provider-account-card .account-card-name-actions .account-card-action {
            display: grid !important;
            flex: 0 0 auto;
            width: 30px !important;
            height: 30px !important;
          }

          .provider-account-card .account-card-name-actions .account-card-action svg,
          .provider-account-card .account-card-name-actions .account-card-action::before {
            width: 24px !important;
            height: 24px !important;
          }

          .provider-account-card .account-card-metrics {
            grid-template-columns: minmax(0, 1fr);
          }

          .provider-account-card .account-card-metrics.two-column-metrics,
          .provider-account-card .account-card-metrics.multi-row-metrics {
            grid-template-columns: repeat(2, minmax(0, 1fr));
          }

          .provider-account-card .account-card-metrics .account-usage-metric,
          .provider-account-card .account-card-metrics .account-usage-metric + .account-usage-metric {
            min-width: 0;
            height: auto;
            border-left: 0 !important;
          }

          .provider-account-card .metric-value-row {
            grid-template-columns: auto minmax(0, 1fr) auto;
          }

          .provider-account-card .account-metric-track {
            min-width: 0;
          }

          .provider-account-card .metric-inline-credit {
            min-width: 0;
            max-width: min(150px, 30%);
            overflow: hidden;
            text-overflow: ellipsis;
          }
          ''')

          refinements = Path('src/ui-refinements.css')
          text = refinements.read_text()
          start = text.index('.account-usage-metric {\n  display: grid;')
          end_marker = '/* The update control uses one real text node.'
          end = text.index(end_marker, start)
          replacement = '''.account-usage-metric {
            display: block;
          }

          .account-usage-metric .metric-heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            min-width: 0;
          }

          .account-usage-metric .metric-label {
            min-width: 0;
          }

          .account-usage-metric .metric-window-pill {
            flex: 0 0 auto;
            width: fit-content;
            margin: 0;
            padding: 2px 7px;
            color: #fff;
            border-color: rgba(255, 255, 255, 0.92);
            background: transparent;
          }

          .account-usage-metric .metric-value-row {
            display: grid;
            grid-template-columns: auto minmax(0, 1fr) auto;
            align-items: center;
            gap: 10px;
            min-width: 0;
          }

          .account-usage-metric .account-metric-track {
            min-width: 0;
          }

          .account-usage-metric .metric-reset {
            display: grid !important;
            grid-template-columns: minmax(0, 1fr) auto;
            align-items: center;
            column-gap: 14px;
            width: 100%;
          }

          .account-usage-metric .metric-reset::after {
            content: attr(data-reset-countdown);
            justify-self: end;
            color: #cbc3d7;
            font-weight: 600;
            white-space: nowrap;
          }

          .account-usage-metric .metric-reset:not([data-reset-countdown])::after {
            display: none;
          }

          /* Keep the full quota metric visible. Only the redundant OpenAI "Session"
             heading is hidden. */
          .ui-hidden-metric {
            display: block !important;
          }

          .ui-hidden-metric-label,
          .ui-hidden-credit,
          .ui-hidden-credit-helper {
            display: none !important;
          }

          '''
          text = text[:start] + replacement + text[end:]
          text = text.replace('grid-template-columns: repeat(2, minmax(210px, 1fr));', 'grid-template-columns: repeat(2, minmax(0, 1fr));', 1)
          text, count = re.subn(r'\n@media \(max-width: 1180px\) \{.*\}\s*\Z', '\n', text, flags=re.S)
          if count != 1:
              raise SystemExit(f'Expected one legacy responsive media block, removed {count}')
          refinements.write_text(text)

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text()
          old = '''## Unreleased

          _No unreleased user-facing changes yet._
'''
          new = '''## Unreleased

          ### Fixed

          - Credits are no longer shown on Google Antigravity or OpenCode Go accounts, which do not report a credit balance.
          - OpenAI usage-window badges now stay in the same top-row position used by other providers.

          ### Improved

          - Usage percentages now omit the redundant word **remaining**.
          - Narrower account cards retain the exact same content, element positions, icon sizes, and typography; only flexible widths such as account names and usage bars contract.
'''
          if old not in text:
              raise SystemExit('Unreleased changelog placeholder not found')
          changelog.write_text(text.replace(old, new, 1))
          PY

      - name: Remove one-time executor
        run: rm .github/workflows/apply-provider-card-fix.yml

      - name: Commit product files
        shell: bash
        run: |
          git config user.name yajinni
          git config user.email yajinni@users.noreply.github.com
          git add src/App.tsx src/obsidian-dashboard.css src/account-card-responsive.css src/ui-refinements.css CHANGELOG.md .github/workflows/apply-provider-card-fix.yml
          git commit -m "Fix provider-specific account card layout"
          git push origin HEAD:ai/fix-provider-card-layout-v2
