name: Run compact cards patch

on:
  push:
    branches:
      - ai/compact-cards-trello-reorder

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai/compact-cards-trello-reorder
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Extract and apply focused patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/apply-compact-cards-trello-reorder.yml').read_text().splitlines()
          start = next(index for index, line in enumerate(workflow) if line.strip() == "python - <<'PY'") + 1
          end = next(index for index in range(start, len(workflow)) if workflow[index].strip() == 'PY')
          script = []
          for line in workflow[start:end]:
              script.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/apply_dashboard_patch.py').write_text('\n'.join(script) + '\n')
          PY
          python /tmp/apply_dashboard_patch.py
      - name: Install dependencies
        run: npm install
      - name: TypeScript check
        run: npm run check
      - name: Production build
        run: npm run build
      - name: Commit product-only changes
        shell: bash
        run: |
          rm .github/workflows/apply-compact-cards-trello-reorder.yml
          rm .github/workflows/run-compact-cards-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md src/App.tsx src/ui-refinements.css src/dashboard-reorder.ts src/dashboard-reorder.css .github/workflows/apply-compact-cards-trello-reorder.yml .github/workflows/run-compact-cards-patch.yml
          git commit -m "improve compact account cards and live reorder preview"
          git push origin HEAD:ai/compact-cards-trello-reorder
