name: Finalize v0.2.47 release

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize-release:
    if: github.head_ref == 'ai/release-v0.2.47' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai/release-v0.2.47
          fetch-depth: 0

      - name: Finalize changelog
        run: python .github/finalize-release-v0.2.47.py

      - name: Remove temporary finalizer
        run: |
          rm .github/finalize-release-v0.2.47.py
          rm .github/workflows/finalize-release-v0.2.47.yml

      - name: Commit final release files
        run: |
          git config user.name yajinni
          git config user.email yajinni@users.noreply.github.com
          git add CHANGELOG.md .github/finalize-release-v0.2.47.py .github/workflows/finalize-release-v0.2.47.yml
          git commit -m "Finalize v0.2.47 changelog"
          git push origin HEAD:ai/release-v0.2.47
