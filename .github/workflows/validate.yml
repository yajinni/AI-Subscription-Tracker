name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  statuses: write

jobs:
  release-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Verify published v0.2.40 release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v0.2.40" > release.json

          echo "Published release assets:"
          jq -r '.assets[] | "\(.name)\t\(.size) bytes\t\(.state)"' release.json

          test "$(jq -r '.tag_name' release.json)" = "v0.2.40"
          jq -e '(.assets | length) > 0' release.json >/dev/null
          jq -e 'all(.assets[]; .state == "uploaded" and .size > 0)' release.json >/dev/null

          jq -r '.assets[].name' release.json > asset-names.txt
          grep -E -- '-setup\.exe$' asset-names.txt
          grep -E -- '\.msi$' asset-names.txt
          grep -Ei -- '(aarch64|arm64).*(\.dmg|\.app\.tar\.gz)$' asset-names.txt
          grep -Ei -- '(x64|x86_64).*(\.dmg|\.app\.tar\.gz)$' asset-names.txt
          grep -Fx -- 'latest.json' asset-names.txt

          latest_id="$(jq -r '.assets[] | select(.name == "latest.json") | .id' release.json)"
          test -n "$latest_id"
          gh api -H 'Accept: application/octet-stream' \
            "repos/${GITHUB_REPOSITORY}/releases/assets/${latest_id}" > latest.json

          echo "Updater metadata:"
          jq . latest.json
          test "$(jq -r '.version' latest.json)" = "0.2.40"
          jq -e '(.platforms | keys | length) >= 3' latest.json >/dev/null
          jq -e 'all(.platforms[]; (.url | contains("/v0.2.40/")) and (.signature | length > 0))' latest.json >/dev/null

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check
      - run: npm run build
      - name: Publish frontend validation status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          state="$JOB_STATUS"
          if [ "$state" = "cancelled" ]; then state="error"; fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context="validate/frontend" \
            -f description="Frontend type-check and production build"

  desktop-rust:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm install
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: cargo check --manifest-path src-tauri/Cargo.toml
      - name: Verify generated native icons
        shell: bash
        run: |
          test -s src-tauri/icons/icon.png
          test -s src-tauri/icons/icon.ico
          test -s src-tauri/icons/icon.icns
      - name: Publish desktop validation status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          TARGET_OS: ${{ matrix.os }}
        run: |
          state="$JOB_STATUS"
          if [ "$state" = "cancelled" ]; then state="error"; fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context="validate/desktop-${TARGET_OS}" \
            -f description="Rust tests, checks, and native icon generation on ${TARGET_OS}"
