name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write
  pull-requests: write
  statuses: write

jobs:
  diagnose-google-ai-studio-cloud-usage-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Diagnose patch transport
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python - <<'PY' > /tmp/patch-diagnostic.txt
          from pathlib import Path
          import base64
          import hashlib
          import string

          allowed = set(string.ascii_letters + string.digits + "+/=")
          parts = [Path(f"scripts/.google-ai-studio-cloud-usage.patch.{index:02d}") for index in range(6)]
          chunks = []
          for part in parts:
              value = part.read_text(encoding="utf-8")
              chunks.append(value.strip())
              invalid = sorted(set(value.strip()) - allowed)
              print(f"{part.name}: characters={len(value)} stripped={len(value.strip())} invalid={invalid!r}")
          encoded = "".join(chunks)
          print(f"encoded characters={len(encoded)} modulo4={len(encoded) % 4}")
          try:
              decoded = base64.b64decode(encoded, validate=True)
              print(f"decoded bytes={len(decoded)}")
              print(f"sha256={hashlib.sha256(decoded).hexdigest()}")
              try:
                  compile(decoded, "apply_google_ai_studio_cloud_usage.py", "exec")
                  print("python syntax=valid")
              except Exception as error:
                  print(f"python syntax error={error!r}")
          except Exception as error:
              print(f"strict decode error={error!r}")
              padded = encoded + "=" * (-len(encoded) % 4)
              try:
                  decoded = base64.b64decode(padded, validate=False)
                  print(f"relaxed decoded bytes={len(decoded)}")
                  print(f"relaxed sha256={hashlib.sha256(decoded).hexdigest()}")
              except Exception as relaxed_error:
                  print(f"relaxed decode error={relaxed_error!r}")
          PY
          {
            echo 'Patch transport diagnostic:'
            echo
            echo '```text'
            cat /tmp/patch-diagnostic.txt
            echo '```'
          } > /tmp/comment.md
          gh pr comment "$PR_NUMBER" --body-file /tmp/comment.md
          cat /tmp/patch-diagnostic.txt
