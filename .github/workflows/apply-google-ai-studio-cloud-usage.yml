name: Temporary Google AI Studio source build

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  build-clean-feature:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Rebuild resilient source-edit script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, lzma
          parts = sorted(Path("scripts").glob(".google-ai-studio-cloud-usage.xz.*"))
          encoded = "".join(part.read_text(encoding="utf-8").strip() for part in parts)
          source = lzma.decompress(base64.b64decode(encoded, validate=True)).decode("utf-8")
          assert hashlib.sha256(source.encode()).hexdigest() == "164a49e4ae1b7dd4a31b8cbb2b57b3aa1e224fc43b5b687ed8e25ececacf997b"
          source = source.replace("from pathlib import Path\n", "from pathlib import Path\nimport re\nimport textwrap\n", 1)
          old_function = '''def replace_once(path: str, old: str, new: str) -> None:
              content = read(path)
              count = content.count(old)
              if count != 1:
                  raise RuntimeError(f"Expected exactly one match in {path}, found {count}: {old[:120]!r}")
              write(path, content.replace(old, new, 1))
          '''
          new_function = '''def replace_once(path: str, old: str, new: str) -> None:
              content = read(path)
              count = content.count(old)
              if count == 1:
                  write(path, content.replace(old, new, 1))
                  return
              parts = []
              for line in old.splitlines(keepends=True):
                  parts.append(r"[ \\t]*" + re.escape(line.lstrip(" \\t")))
              matches = list(re.finditer("".join(parts), content))
              if len(matches) != 1:
                  raise RuntimeError(f"Expected exactly one match in {path}, found {count} exact and {len(matches)} whitespace-flexible: {old[:120]!r}")
              match = matches[0]
              first = match.group(0).splitlines()[0]
              indent = first[: len(first) - len(first.lstrip(" \\t"))]
              replacement = textwrap.indent(textwrap.dedent(new), indent)
              write(path, content[: match.start()] + replacement + content[match.end() :])
          '''
          old_function = textwrap.dedent(old_function)
          new_function = textwrap.dedent(new_function)
          assert source.count(old_function) == 1
          source = source.replace(old_function, new_function)
          Path("/tmp/apply_google_ai_studio_cloud_usage.py").write_text(source, encoding="utf-8")
          compile(source, "apply_google_ai_studio_cloud_usage.py", "exec")
          PY
      - name: Start clean feature branch
        shell: bash
        run: git checkout -B ai/google-ai-studio-cloud-usage-v2 origin/main
      - name: Apply ordinary source edits
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set +e
          python /tmp/apply_google_ai_studio_cloud_usage.py > /tmp/source-edit.log 2>&1
          result=$?
          set -e
          if [ "$result" -ne 0 ]; then
            { echo '## Temporary build failure'; echo; echo '```text'; tail -n 100 /tmp/source-edit.log; echo '```'; } > /tmp/pr-body.md
            gh pr edit "$PR_NUMBER" --body-file /tmp/pr-body.md || true
          fi
          cat /tmp/source-edit.log
          exit "$result"
      - name: Require provider-reported usage points
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src-tauri/src/providers/google_ai_studio.rs")
          source = path.read_text(encoding="utf-8")
          old = "        let Some(model) = selected_by_name.get(model_name.as_str()) else {\n            continue;\n        };\n        let used = usage_for_window(&bucket.usage_points, kind, now).max(0.0);\n"
          new = "        let Some(model) = selected_by_name.get(model_name.as_str()) else {\n            continue;\n        };\n        if bucket.usage_points.is_empty() {\n            continue;\n        }\n        let used = usage_for_window(&bucket.usage_points, kind, now).max(0.0);\n"
          assert source.count(old) == 1
          path.write_text(source.replace(old, new), encoding="utf-8")
          PY
      - name: Format and validate
        shell: bash
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml
          npm install
          npm run check
          npm run build
          cargo test --manifest-path src-tauri/Cargo.toml
          cargo check --manifest-path src-tauri/Cargo.toml
          git diff --check
      - name: Commit clean source changes
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add CHANGELOG.md src src-tauri/src
          git commit -m "feat: add Google AI Studio Cloud usage"
          git push --force-with-lease origin HEAD:ai/google-ai-studio-cloud-usage-v2
