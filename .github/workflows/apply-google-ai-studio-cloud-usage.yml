name: Temporary Google AI Studio source build

on:
  push:
    branches:
      - ai/temp-google-ai-studio-source-build
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  build-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Rebuild source-edit script
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, lzma, subprocess

          parts = sorted(Path("scripts").glob(".google-ai-studio-cloud-usage.xz.*"))
          encoded_parts = [part.read_text(encoding="utf-8").strip() for part in parts]
          encoded = "".join(encoded_parts)
          lines = [f"{part.name}: {len(value)} chars" for part, value in zip(parts, encoded_parts)]
          try:
              compressed = base64.b64decode(encoded, validate=True)
              source = lzma.decompress(compressed)
              source_hash = hashlib.sha256(source).hexdigest()
              lines += [f"encoded: {len(encoded)} chars", f"compressed: {len(compressed)} bytes", f"source: {len(source)} bytes", f"sha256: {source_hash}"]
              Path("scripts/apply_google_ai_studio_cloud_usage.py").write_bytes(source)
              compile(source, "apply_google_ai_studio_cloud_usage.py", "exec")
              ok = source_hash == "164a49e4ae1b7dd4a31b8cbb2b57b3aa1e224fc43b5b687ed8e25ececacf997b"
          except Exception as error:
              lines.append(f"error: {error!r}")
              ok = False
          Path("/tmp/source-build-diagnostic.txt").write_text("\n".join(lines) + "\n", encoding="utf-8")
          if not ok:
              raise SystemExit(1)
          PY
          if [ -n "$PR_NUMBER" ]; then
            { echo 'Temporary source build diagnostic:'; echo; echo '```text'; cat /tmp/source-build-diagnostic.txt; echo '```'; } > /tmp/source-build-comment.md
            gh pr comment "$PR_NUMBER" --body-file /tmp/source-build-comment.md || true
          fi
          cat /tmp/source-build-diagnostic.txt
      - name: Apply ordinary source edits
        run: python scripts/apply_google_ai_studio_cloud_usage.py
      - name: Remove temporary transport files
        shell: bash
        run: |
          rm -f scripts/.google-ai-studio-cloud-usage.xz.*
          rm -f scripts/.google-ai-studio-cloud-usage.part.*
          rm -f scripts/.google-ai-studio-cloud-usage.patch.*
          rm -f scripts/apply_google_ai_studio_cloud_usage.py
          rm -f .github/workflows/apply-google-ai-studio-cloud-usage.yml
          git show origin/main:.github/workflows/validate.yml > .github/workflows/validate.yml
      - name: Format Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Install frontend dependencies
        run: npm install
      - run: npm run check
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: cargo check --manifest-path src-tauri/Cargo.toml
      - name: Verify final source diff
        shell: bash
        run: |
          git diff --check
          git status --short
      - name: Package source tree
        shell: bash
        run: tar --exclude=.git --exclude=node_modules --exclude=src-tauri/target -czf /tmp/google-ai-studio-source.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: google-ai-studio-source
          path: /tmp/google-ai-studio-source.tgz
          if-no-files-found: error
