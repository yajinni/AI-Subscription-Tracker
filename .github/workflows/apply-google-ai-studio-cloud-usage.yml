name: Temporary Google AI Studio source build

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild source-edit script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, lzma
          parts = sorted(Path("scripts").glob(".google-ai-studio-cloud-usage.xz.*"))
          encoded = "".join(part.read_text(encoding="utf-8").strip() for part in parts)
          source = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(source).hexdigest() == "164a49e4ae1b7dd4a31b8cbb2b57b3aa1e224fc43b5b687ed8e25ececacf997b"
          Path("scripts/apply_google_ai_studio_cloud_usage.py").write_bytes(source)
          PY
      - name: Apply source edits and retain diagnostics
        shell: bash
        run: |
          set +e
          python scripts/apply_google_ai_studio_cloud_usage.py > /tmp/apply-source.log 2>&1
          echo "$?" > /tmp/apply-source-exit-code.txt
          set -e
          cat /tmp/apply-source.log
      - name: Package partial source tree and traceback
        shell: bash
        run: |
          tar --exclude=.git --exclude=node_modules --exclude=src-tauri/target -czf /tmp/google-ai-studio-partial-source.tgz .
          mkdir -p /tmp/google-ai-studio-diagnostic
          cp /tmp/google-ai-studio-partial-source.tgz /tmp/google-ai-studio-diagnostic/
          cp /tmp/apply-source.log /tmp/google-ai-studio-diagnostic/
          cp /tmp/apply-source-exit-code.txt /tmp/google-ai-studio-diagnostic/
      - uses: actions/upload-artifact@v4
        with:
          name: google-ai-studio-partial-source
          path: /tmp/google-ai-studio-diagnostic
          if-no-files-found: error
