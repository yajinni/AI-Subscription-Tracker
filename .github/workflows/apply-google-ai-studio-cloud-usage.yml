name: Temporary Google AI Studio source build

on:
  push:
    branches:
      - ai/temp-google-ai-studio-source-build
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Rebuild source-edit script
        shell: bash
        run: |
          cat scripts/.google-ai-studio-cloud-usage.xz.* | base64 --decode > /tmp/google-ai-studio-source-edit.xz
          xz --decompress --stdout /tmp/google-ai-studio-source-edit.xz > scripts/apply-google_ai_studio_cloud_usage.py
          python -m py_compile scripts/apply_google_ai_studio_cloud_usage.py
          test "$(sha256sum scripts/apply_google_ai_studio_cloud_usage.py | awk '{print $1}')" = "164a49e4ae1b7dd4a31b8cbb2b57b3aa1e224fc43b5b687ed8e25ececacf997b"
      - name: Apply ordinary source edits
        run: python scripts/apply_google_ai_studio_cloud_usage.py
      - name: Remove temporary transport files
        shell: bash
        run: |
          rm -f scripts/.google-ai-studio-cloud-usage.xz.*
          rm -f scripts/.google-ai-studio-cloud-usage.part.*
          rm -f scripts/.google-ai-studio-cloud-usage.patch.*
          rm -f scripts/apply_google_ai_studio_cloud_usage.py
          rm -f .github/workflows/apply-google-ai-studio-cloud-usage.yml
          git show origin/main:.github/workflows/validate.yml > .github/workflows/validate.yml
      - name: Format Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Install frontend dependencies
        run: npm install
      - run: npm run check
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: cargo check --manifest-path src-tauri/Cargo.toml
      - name: Verify final source diff
        shell: bash
        run: |
          git diff --check
          git status --short
      - name: Package source tree
        shell: bash
        run: tar --exclude=.git --exclude=node_modules --exclude=src-tauri/target -czf /tmp/google-ai-studio-source.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: google-ai-studio-source
          path: /tmp/google-ai-studio-source.tgz
          if-no-files-found: error
