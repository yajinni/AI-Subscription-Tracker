name: Verify v0.2.41 release

on:
  pull_request:
    paths:
      - .github/workflows/verify-release-v0.2.41.yml

permissions:
  contents: read

jobs:
  release-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for and verify published v0.2.41 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: 684df1ebe74c7e3a6c88617161faf99d09971de6
        run: |
          set -euo pipefail

          for attempt in $(seq 1 90); do
            if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v0.2.41" > release.json 2>/dev/null; then
              break
            fi
            echo "Waiting for v0.2.41 release (${attempt}/90)..."
            sleep 10
          done

          test -s release.json
          test "$(jq -r '.tag_name' release.json)" = "v0.2.41"
          test "$(jq -r '.draft' release.json)" = "false"
          test "$(jq -r '.prerelease' release.json)" = "false"

          tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v0.2.41" --jq '.object.sha')"
          test "$tag_sha" = "$EXPECTED_SHA"

          echo "Published release assets:"
          jq -r '.assets[] | "\(.name)\t\(.size) bytes\t\(.state)"' release.json
          jq -e '(.assets | length) > 0' release.json >/dev/null
          jq -e 'all(.assets[]; .state == "uploaded" and .size > 0)' release.json >/dev/null

          jq -r '.assets[].name' release.json > asset-names.txt
          grep -E -- '-setup\.exe$' asset-names.txt
          grep -E -- '\.msi$' asset-names.txt
          grep -Ei -- '(aarch64|arm64).*(\.dmg|\.app\.tar\.gz)$' asset-names.txt
          grep -Ei -- '(x64|x86_64).*(\.dmg|\.app\.tar\.gz)$' asset-names.txt
          grep -Fx -- 'latest.json' asset-names.txt

          latest_id="$(jq -r '.assets[] | select(.name == "latest.json") | .id' release.json)"
          test -n "$latest_id"
          gh api -H 'Accept: application/octet-stream' \
            "repos/${GITHUB_REPOSITORY}/releases/assets/${latest_id}" > latest.json

          echo "Updater metadata:"
          jq . latest.json
          test "$(jq -r '.version' latest.json)" = "0.2.41"
          jq -e '(.platforms | keys | length) >= 3' latest.json >/dev/null
          jq -e 'all(.platforms[]; (.url | contains("/releases/assets/")) and (.signature | length > 0))' latest.json >/dev/null
