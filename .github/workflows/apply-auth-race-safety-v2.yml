          replace_regex(
              "src-tauri/src/opencode_login.rs",
              r"        Ok\(account\) => \{\n            \*state\.pending_login\.write\(\) = Some\(LoginStatus \{.*?\n            let _ = window\.destroy\(\);\n        \}",
              '''        Ok(account) => {
            let completed = {
                let mut pending = state.pending_login.write();
                if pending.as_ref().is_some_and(|login| {
                    login.attempt_id == attempt_id && login.status == "waiting"
                }) {
                    *pending = Some(LoginStatus {
