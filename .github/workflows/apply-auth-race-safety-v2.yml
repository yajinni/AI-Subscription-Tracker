name: Apply authentication race safety v2

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/apply-auth-race-safety-v2.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply robust race-safety patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def replace_regex(path: str, pattern: str, replacement: str) -> None:
              file = Path(path)
              text = file.read_text()
              next_text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"{path}: expected one regex match, found {count}: {pattern[:120]!r}")
              file.write_text(next_text)

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one exact match, found {count}: {old[:120]!r}")
              file.write_text(text.replace(old, new, 1))

          replace_regex(
              "src-tauri/src/lib.rs",
              r"fn cancel_login\(.*?\n\}\n\n#\[tauri::command\]\nasync fn refresh_account",
              '''fn cancel_login(
    app: AppHandle,
    state: State<'_, Arc<AppState>>,
    attempt_id: String,
) -> Result<(), String> {
    let cancelled = {
        let mut pending = state.pending_login.write();
        let cancellable = pending.as_ref().is_some_and(|login| {
            login.attempt_id == attempt_id
                && matches!(
                    login.status.as_str(),
                    "waiting" | "choose_project" | "monitoring_disabled"
                )
        });
        if cancellable {
            *pending = Some(LoginStatus {
                attempt_id: attempt_id.clone(),
                status: "failed".into(),
                message: Some("Authentication was cancelled.".into()),
                account: None,
            });
        }
        cancellable
    };

    state.stop_login_shutdown(&attempt_id);
    if !cancelled {
        return Ok(());
    }

    for label in ["opencode-go-login", "grok-login"] {
        if let Some(window) = app.get_webview_window(label) {
            let _ = window.destroy();
        }
    }
    Ok(())
}

#[tauri::command]
async fn refresh_account''',
          )

          replace_regex(
              "src-tauri/src/oauth.rs",
              r"    save_provider_secret\(&account\.id, &secret\).*?    Ok\(account\)\n",
              '''    let mut pending = context.app.pending_login.write();
    if !pending.as_ref().is_some_and(|login| {
        login.attempt_id == context.attempt_id && login.status == "waiting"
    }) {
        return Err("The login attempt was cancelled.".into());
    }
    save_provider_secret(&account.id, &secret).map_err(|error| error.to_string())?;
    let account = context
        .app
        .store
        .upsert(account)
        .map_err(|error| error.to_string())?;
    *pending = Some(LoginStatus {
        attempt_id: context.attempt_id.clone(),
        status: "complete".into(),
        message: None,
        account: Some(account.clone()),
    });
    Ok(account)
''',
          )

          replace_once(
              "src-tauri/src/google_ai_studio_oauth.rs",
              '''    let email = fetch_email(context.app.as_ref(), &oauth.access_token)
        .await
        .ok();
    stored.cloud_oauth = Some(oauth.clone());
''',
              '''    let email = fetch_email(context.app.as_ref(), &oauth.access_token)
        .await
        .ok();
    if !is_waiting(context.app.as_ref(), &context.attempt_id) {
        return Err("The Google authorization was cancelled.".into());
    }
    stored.cloud_oauth = Some(oauth.clone());
''',
          )
          replace_regex(
              "src-tauri/src/google_ai_studio_oauth.rs",
              r"fn apply_outcome\(app: &AppState, attempt_id: &str, outcome: CallbackOutcome\) -> Result<\(\), String> \{.*?\n\}\n\nfn setup_message",
              '''fn apply_outcome(
    app: &AppState,
    attempt_id: &str,
    outcome: CallbackOutcome,
) -> Result<(), String> {
    let status = match outcome {
        CallbackOutcome::Complete(account) => LoginStatus {
            attempt_id: attempt_id.into(),
            status: "complete".into(),
            message: None,
            account: Some(account),
        },
        CallbackOutcome::ChooseProject(projects) => LoginStatus {
            attempt_id: attempt_id.into(),
            status: "choose_project".into(),
            message: Some(setup_message(projects, None)?),
            account: None,
        },
        CallbackOutcome::MonitoringDisabled(project) => LoginStatus {
            attempt_id: attempt_id.into(),
            status: "monitoring_disabled".into(),
            message: Some(setup_message(
                vec![project.clone()],
                Some(project.project_id),
            )?),
            account: None,
        },
    };
    let mut pending = app.pending_login.write();
    if !pending
        .as_ref()
        .is_some_and(|login| login.attempt_id == attempt_id && login.status == "waiting")
    {
        return Err("The Google authorization was cancelled.".into());
    }
    *pending = Some(status);
    Ok(())
}

fn setup_message''',
