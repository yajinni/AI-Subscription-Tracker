          PY
          cargo fmt --manifest-path src-tauri/Cargo.toml
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Install frontend dependencies
        run: npm install
      - name: Validate frontend
        run: |
          npm run check
          npm run build
      - name: Commit race-safety changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/grok_login.rs src-tauri/src/google_ai_studio_oauth.rs src-tauri/src/lib.rs src-tauri/src/oauth.rs src-tauri/src/opencode_login.rs
          git commit -m "Prevent stale authentication completion after cancel"
          git push origin HEAD:${{ github.head_ref }}
